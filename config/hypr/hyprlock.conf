general {
    hide_cursor = true
}

auth {
    pam {
        enabled = true
    }
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/.local/share/wall.png
}

input-field {
    monitor =

    fade_on_empty = false

    size = 290, 45
    outline_thickness = 2
    dots_size = 0.2

    outer_color = 0xff3b4252
    inner_color = 0xff2e3440

    font_color = 0xffd8dee9
    font_family = JetBrainsMono Nerd Font

    rounding = 0

    check_color = 0xffa3be8c
    fail_color = 0xffbf616a
    fail_text = Authentication Failed
    capslock_color = 0xffd08770
    numlock_color = 0xff3b4252
    bothlock_color = 0xffd08770

    halign = center
    valign = center
}
