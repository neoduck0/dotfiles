onboarding = false
[theme]
name = "nord"

[keys]
prefix = "ctrl+a"
detach = "prefix+d"
split_horizontal = "prefix+s"
settings = "prefix+shift+s"
switch_workspace = "prefix+shift+1..9"
new_workspace = "prefix+shift+c"

[ui]
prompt_new_tab_name = false
tab_bar_position = "bottom"

[ui.toast]
delivery = "system"
